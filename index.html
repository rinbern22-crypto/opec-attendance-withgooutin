<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>OPEC Employee Attendance</title>

  <!-- QR SCANNER LIBRARY -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    .container {
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
      padding: 25px 15px 40px;
    }

    /* HEADER */
    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header h1 {
      margin: 0;
      font-size: 30px;
      font-weight: 700;
      color: #111827;
    }

    .header p {
      margin: 7px 0 0;
      font-size: 16px;
      color: #6b7280;
    }

    /* MODE BUTTONS */
    .mode-buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    .mode-btn {
      border: none;
      border-radius: 10px;
      padding: 15px 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      background: #e5e7eb;
      color: #374151;
      transition: 0.2s;
    }

    .mode-btn:hover {
      transform: translateY(-1px);
    }

    .mode-btn.active {
      background: #111827;
      color: white;
    }

    /* INSTRUCTION */
    .instruction {
      text-align: center;
      margin-bottom: 15px;
      padding: 12px;
      border-radius: 10px;
      background: white;
      font-size: 16px;
      font-weight: 600;
      color: #374151;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    /* SCANNER */
    .scanner-container {
      background: white;
      border-radius: 15px;
      padding: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    #reader {
      width: 100%;
      min-height: 300px;
      overflow: hidden;
      border-radius: 12px;
    }

    /* STATUS */
    #status {
      margin-top: 15px;
      text-align: center;
      padding: 12px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      display: none;
    }

    #status.info {
      display: block;
      background: #eff6ff;
      color: #1d4ed8;
    }

    #status.success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    #status.error {
      display: block;
      background: #fee2e2;
      color: #b91c1c;
    }

    /* RESULT CARD */
    #result {
      display: none;
      margin-top: 20px;
      background: white;
      border-radius: 15px;
      padding: 25px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.10);
      text-align: center;
    }

    .result-action {
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 18px;
      color: #166534;
    }

    .result-success {
      color: #166534;
    }

    .result-error {
      color: #b91c1c;
    }

    .employee-name {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .employee-details {
      font-size: 15px;
      line-height: 1.8;
      color: #4b5563;
    }

    .result-line {
      margin: 4px 0;
    }

    .result-label {
      font-weight: 700;
      color: #374151;
    }

    /* REASON MODAL */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal {
      width: 100%;
      max-width: 500px;
      background: white;
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.25);
    }

    .modal h2 {
      margin: 0 0 8px;
      font-size: 24px;
    }

    .modal p {
      margin: 5px 0 15px;
      color: #6b7280;
      line-height: 1.5;
    }

    .modal textarea {
      width: 100%;
      min-height: 120px;
      resize: vertical;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      padding: 12px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 16px;
      outline: none;
    }

    .modal textarea:focus {
      border-color: #111827;
    }

    .modal-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 15px;
    }

    .modal-btn {
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .cancel-btn {
      background: #e5e7eb;
      color: #374151;
    }

    .submit-btn {
      background: #111827;
      color: white;
    }

    /* MOBILE */
    @media (max-width: 600px) {

      .container {
        padding: 18px 10px 30px;
      }

      .header h1 {
        font-size: 25px;
      }

      .header p {
        font-size: 14px;
      }

      .mode-btn {
        font-size: 12px;
        padding: 13px 5px;
      }

      #reader {
        min-height: 280px;
      }

      .result-action {
        font-size: 26px;
      }

      .employee-name {
        font-size: 21px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- HEADER -->
    <div class="header">
      <h1>OPEC</h1>
      <p>Employee Attendance</p>
    </div>


    <!-- MODE BUTTONS -->
    <div class="mode-buttons">

      <button
        id="attendanceBtn"
        class="mode-btn active"
        onclick="changeMode('attendance')">
        ATTENDANCE
      </button>

      <button
        id="goingOutBtn"
        class="mode-btn"
        onclick="changeMode('out')">
        GOING OUT
      </button>

      <button
        id="goingInBtn"
        class="mode-btn"
        onclick="changeMode('in')">
        GOING IN
      </button>

    </div>


    <!-- INSTRUCTION -->
    <div id="instruction" class="instruction">
      Please scan your employee QR code for attendance.
    </div>


    <!-- SCANNER -->
    <div class="scanner-container">

      <div id="reader"></div>

      <div id="status"></div>

    </div>


    <!-- RESULT -->
    <div id="result"></div>

  </div>


  <!-- GOING OUT REASON MODAL -->
  <div id="reasonModal" class="modal-overlay">

    <div class="modal">

      <h2>Going Out</h2>

      <p>
        Please enter the reason for going out.
      </p>

      <p>
        <strong id="reasonEmployee"></strong>
      </p>

      <textarea
        id="reasonInput"
        placeholder="Enter reason..."
      ></textarea>

      <div class="modal-buttons">

        <button
          class="modal-btn cancel-btn"
          onclick="cancelReason()">
          CANCEL
        </button>

        <button
          class="modal-btn submit-btn"
          onclick="submitReason()">
          SUBMIT
        </button>

      </div>

    </div>

  </div>


  <script>

    /*
     * ============================================================
     * OPEC EMPLOYEE ATTENDANCE
     * GITHUB PAGES FRONTEND
     * ============================================================
     */


    /*
     * ============================================================
     * APPS SCRIPT WEB APP URL
     * ============================================================
     */

    const APPS_SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbzGOXVeUcPT0Pg2YkIMmnycxYrrjgG1HyQRoywMT4q8gjrIpuft-vtm3kEKrKQX-4qmzQ/exec";


    /*
     * ============================================================
     * GLOBAL VARIABLES
     * ============================================================
     */

    let currentMode = "attendance";

    let scanner = null;

    let scanning = false;

    let processingScan = false;

    let pendingQR = "";

    let reasonEmployeeName = "";


    /*
     * ============================================================
     * CHANGE MODE
     * ============================================================
     */

    function changeMode(mode) {

      currentMode = mode;

      hideResult();

      setStatus("", "");

      /*
       * Update buttons
       */

      document
        .getElementById("attendanceBtn")
        .classList.remove("active");

      document
        .getElementById("goingOutBtn")
        .classList.remove("active");

      document
        .getElementById("goingInBtn")
        .classList.remove("active");


      if (mode === "attendance") {

        document
          .getElementById("attendanceBtn")
          .classList.add("active");

        document
          .getElementById("instruction")
          .textContent =
          "Please scan your employee QR code for attendance.";

      }


      else if (mode === "out") {

        document
          .getElementById("goingOutBtn")
          .classList.add("active");

        document
          .getElementById("instruction")
          .textContent =
          "Please scan your employee QR code before going out.";

      }


      else if (mode === "in") {

        document
          .getElementById("goingInBtn")
          .classList.add("active");

        document
          .getElementById("instruction")
          .textContent =
          "Please scan your employee QR code when coming back.";

      }


      /*
       * Restart scanner
       */

      restartScanner();

    }


    /*
     * ============================================================
     * START SCANNER
     * ============================================================
     */

    function startScanner() {

      if (scanning) {
        return;
      }

      scanner = new Html5Qrcode("reader");

      scanner
        .start(

          {
            facingMode: "user"
          },

          {
            fps: 10,

            qrbox: {
              width: 280,
              height: 280
            },

            aspectRatio: 1.0

          },

          function(decodedText, decodedResult) {

            processQRCode(decodedText);

          },

          function(errorMessage) {

            /*
             * Ignore normal scanning errors.
             */

          }

        )
        .then(function() {

          scanning = true;

          setStatus(
            "Camera ready. Please scan your QR code.",
            "info"
          );

        })

        .catch(function(error) {

          console.error("Camera error:", error);

          scanning = false;

          setStatus(
            "Unable to access the camera. Please check your browser camera permission.",
            "error"
          );

        });

    }


    /*
     * ============================================================
     * STOP SCANNER
     * ============================================================
     */

    async function stopScanner() {

      if (!scanner || !scanning) {
        return;
      }

      try {

        await scanner.stop();

      }

      catch (error) {

        console.log("Scanner stop:", error);

      }

      scanning = false;

    }


    /*
     * ============================================================
     * RESTART SCANNER
     * ============================================================
     */

    async function restartScanner() {

      await stopScanner();

      setTimeout(function() {

        startScanner();

      }, 300);

    }


    /*
     * ============================================================
     * PROCESS QR CODE
     * ============================================================
     */

    function processQRCode(qrValue) {

      if (processingScan) {
        return;
      }

      if (!qrValue) {
        return;
      }

      processingScan = true;

      /*
       * Stop scanning while processing.
       * This prevents the same QR from being scanned repeatedly.
       */

      stopScanner();

      setStatus(
        "Processing...",
        "info"
      );


      /*
       * ATTENDANCE
       */

      if (currentMode === "attendance") {

        callAppsScript(
          "attendance",
          qrValue,
          ""
        );

      }


      /*
       * GOING OUT
       */

      else if (currentMode === "out") {

        pendingQR = qrValue;

        callAppsScript(
          "out",
          qrValue,
          ""
        );

      }


      /*
       * GOING IN
       */

      else if (currentMode === "in") {

        callAppsScript(
          "in",
          qrValue,
          ""
        );

      }

    }


    /*
     * ============================================================
     * CALL APPS SCRIPT USING JSONP
     * ============================================================
     */

    function callAppsScript(action, qrValue, reason) {

      const callbackName =
        "opecCallback_" +
        Date.now() +
        "_" +
        Math.floor(Math.random() * 10000);


      const params =
        new URLSearchParams();


      params.append(
        "qr",
        qrValue
      );


      params.append(
        "action",
        action
      );


      if (reason) {

        params.append(
          "reason",
          reason
        );

      }


      params.append(
        "callback",
        callbackName
      );


      const script =
        document.createElement("script");


      script.src =
        APPS_SCRIPT_URL +
        "?" +
        params.toString();


      /*
       * SUCCESSFUL JSONP RESPONSE
       */

      window[callbackName] =
        function(result) {

          handleServerResult(result);

          /*
           * Clean callback
           */

          try {

            delete window[callbackName];

          }

          catch (error) {

            window[callbackName] =
              undefined;

          }

          /*
           * Remove script
           */

          if (script.parentNode) {

            script.parentNode.removeChild(script);

          }

        };


      /*
       * NETWORK ERROR
       */

      script.onerror =
        function() {

          handleFailure(
            "Unable to connect to the attendance server. Please try again."
          );


          try {

            delete window[callbackName];

          }

          catch (error) {

            window[callbackName] =
              undefined;

          }


          if (script.parentNode) {

            script.parentNode.removeChild(script);

          }

        };


      document.body.appendChild(script);

    }


    /*
     * ============================================================
     * HANDLE APPS SCRIPT RESULT
     * ============================================================
     */

    function handleServerResult(result) {

      console.log(
        "Apps Script result:",
        result
      );


      /*
       * No result
       */

      if (!result) {

        handleFailure(
          "No response was received from the attendance server."
        );

        return;

      }


      /*
       * GOING OUT REQUIRES REASON
       */

      if (
        currentMode === "out" &&
        result.requiresReason
      ) {

        reasonEmployeeName =
          result.employeeName || "";

        pendingQR =
          pendingQR || "";


        openReasonModal(
          result.employeeName || "Employee"
        );

        return;

      }


      /*
       * ERROR RESPONSE
       */

      if (!result.success) {

        const message =
          result.message ||
          "Unable to record attendance.";


        showResult(

          "<div class='result-action result-error'>✕ ERROR</div>" +

          "<div class='employee-details'>" +

          escapeHTML(message) +

          "</div>",

          "error"

        );


        setStatus(
          message,
          "error"
        );


        /*
         * Restart scanner
         */

        setTimeout(function() {

          processingScan = false;

          restartScanner();

        }, 3000);


        return;

      }


      /*
       * ========================================================
       * SUCCESS RESPONSE
       * ========================================================
       */

      let actionMessage = "";


      if (result.action === "TIME IN") {

        actionMessage =
          "✓ TIME IN recorded successfully.";

      }

      else if (result.action === "TIME OUT") {

        actionMessage =
          "✓ TIME OUT recorded successfully.";

      }

      else if (result.action === "GOING OUT") {

        actionMessage =
          "✓ GOING OUT recorded successfully.";

      }

      else if (result.action === "GOING IN") {

        actionMessage =
          "✓ GOING IN recorded successfully.";

      }

      else {

        actionMessage =
          "✓ Recorded successfully.";

      }


      /*
       * Build result information
       */

      let html = "";


      /*
       * ACTION
       */

      html +=
        "<div class='result-action'>" +

        escapeHTML(
          actionMessage
        ) +

        "</div>";


      /*
       * EMPLOYEE NAME
       */

      if (result.employeeName) {

        html +=
          "<div class='employee-name'>" +

          escapeHTML(
            result.employeeName
          ) +

          "</div>";

      }


      /*
       * EMPLOYEE DETAILS
       */

      html +=
        "<div class='employee-details'>";


      if (result.employeeId) {

        html +=
          "<div class='result-line'>" +

          "<span class='result-label'>Employee ID:</span> " +

          escapeHTML(
            result.employeeId
          ) +

          "</div>";

      }


      if (result.department) {

        html +=
          "<div class='result-line'>" +

          "<span class='result-label'>Department:</span> " +

          escapeHTML(
            result.department
          ) +

          "</div>";

      }


      if (result.date) {

        html +=
          "<div class='result-line'>" +

          "<span class='result-label'>Date:</span> " +

          escapeHTML(
            result.date
          ) +

          "</div>";

      }


      if (result.time) {

        html +=
          "<div class='result-line'>" +

          "<span class='result-label'>Time:</span> " +

          escapeHTML(
            result.time
          ) +

          "</div>";

      }


      /*
       * REASON
       */

      if (result.reason) {

        html +=
          "<div class='result-line'>" +

          "<span class='result-label'>Reason:</span> " +

          escapeHTML(
            result.reason
          ) +

          "</div>";

      }


      /*
       * OUTSIDE DURATION
       */

      if (result.outsideDuration) {

        html +=
          "<div class='result-line'>" +

          "<span class='result-label'>Outside Duration:</span> " +

          escapeHTML(
            result.outsideDuration
          ) +

          "</div>";

      }


      /*
       * END DETAILS
       */

      html +=
        "</div>";


      /*
       * Show result
       */

      showResult(
        html,
        "success"
      );


      /*
       * Show action clearly in status
       */

      setStatus(
        actionMessage,
        "success"
      );


      /*
       * Automatically return to scanner
       * after 4 seconds.
       */

      setTimeout(function() {

        hideResult();

        processingScan = false;

        restartScanner();

      }, 4000);

    }


    /*
     * ============================================================
     * OPEN GOING OUT REASON MODAL
     * ============================================================
     */

    function openReasonModal(employeeName) {

      document
        .getElementById("reasonEmployee")
        .textContent =
        employeeName;


      document
        .getElementById("reasonInput")
        .value = "";


      document
        .getElementById("reasonModal")
        .style.display =
        "flex";


      setTimeout(function() {

        document
          .getElementById("reasonInput")
          .focus();

      }, 100);

    }


    /*
     * ============================================================
     * CANCEL REASON
     * ============================================================
     */

    function cancelReason() {

      document
        .getElementById("reasonModal")
        .style.display =
        "none";


      pendingQR = "";

      reasonEmployeeName = "";


      setStatus(
        "Going Out cancelled.",
        "info"
      );


      processingScan = false;

      restartScanner();

    }


    /*
     * ============================================================
     * SUBMIT REASON
     * ============================================================
     */

    function submitReason() {

      const reason =
        document
          .getElementById("reasonInput")
          .value
          .trim();


      if (!reason) {

        alert(
          "Please enter the reason for going out."
        );

        return;

      }


      if (!pendingQR) {

        alert(
          "QR code information is missing. Please scan again."
        );

        cancelReason();

        return;

      }


      /*
       * Close modal
       */

      document
        .getElementById("reasonModal")
        .style.display =
        "none";


      setStatus(
        "Recording GOING OUT...",
        "info"
      );


      /*
       * Send reason to Apps Script
       */

      callAppsScript(
        "out",
        pendingQR,
        reason
      );

    }


    /*
     * ============================================================
     * SHOW RESULT
     * ============================================================
     */

    function showResult(html, type) {

      const result =
        document.getElementById("result");


      result.innerHTML =
        html;


      result.style.display =
        "block";


      /*
       * Scroll result into view
       */

      setTimeout(function() {

        result.scrollIntoView({
          behavior: "smooth",
          block: "center"
        });

      }, 100);

    }


    /*
     * ============================================================
     * HIDE RESULT
     * ============================================================
     */

    function hideResult() {

      const result =
        document.getElementById("result");


      result.style.display =
        "none";


      result.innerHTML =
        "";

    }


    /*
     * ============================================================
     * STATUS MESSAGE
     * ============================================================
     */

    function setStatus(message, type) {

      const status =
        document.getElementById("status");


      if (!message) {

        status.style.display =
          "none";

        status.className =
          "";

        status.textContent =
          "";

        return;

      }


      status.textContent =
        message;


      status.className =
        type || "info";


      status.style.display =
        "block";

    }


    /*
     * ============================================================
     * HANDLE FAILURE
     * ============================================================
     */

    function handleFailure(message) {

      console.error(
        "Attendance error:",
        message
      );


      showResult(

        "<div class='result-action result-error'>" +

        "✕ ERROR" +

        "</div>" +

        "<div class='employee-details'>" +

        escapeHTML(
          message
        ) +

        "</div>",

        "error"

      );


      setStatus(
        message,
        "error"
      );


      setTimeout(function() {

        processingScan = false;

        restartScanner();

      }, 3000);

    }


    /*
     * ============================================================
     * ESCAPE HTML
     * ============================================================
     */

    function escapeHTML(value) {

      if (value === null ||
          value === undefined) {

        return "";

      }


      return String(value)

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }


    /*
     * ============================================================
     * CLOSE MODAL WHEN CLICKING OUTSIDE
     * ============================================================
     */

    document
      .getElementById("reasonModal")
      .addEventListener(
        "click",
        function(event) {

          if (
            event.target ===
            this
          ) {

            cancelReason();

          }

        }
      );


    /*
     * ============================================================
     * ENTER KEY FOR REASON
     * ============================================================
     */

    document
      .getElementById("reasonInput")
      .addEventListener(
        "keydown",
        function(event) {

          /*
           * Ctrl + Enter
           */

          if (
            event.key === "Enter" &&
            event.ctrlKey
          ) {

            submitReason();

          }

        }
      );


    /*
     * ============================================================
     * START APPLICATION
     * ============================================================
     */

    window.addEventListener(
      "load",
      function() {

        changeMode(
          "attendance"
        );

      }
    );

  </script>

</body>
</html>
